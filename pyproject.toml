[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-portfolio"
version = "0.1.0"
description = "Track a crypto portfolio with CLI and web UI."
requires-python = ">=3.9"

[project.scripts]
crypto-portfolio = "crypto_portfolio.cli:main"

[tool.setuptools]
packages = ["crypto_portfolio"]
