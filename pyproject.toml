[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-portfolio"
version = "0.1.0"
description = "A small crypto portfolio tracker with cost basis, valuation, and allocation."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
crypto-portfolio = "crypto_portfolio.cli:main"

[tool.setuptools]
packages = ["crypto_portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
